name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  check-php:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: actions/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: find app -name "*.php" -type f -exec php -l {} \; | grep -v "No syntax errors"

      - name: PHP version
        run: php --version

  check-node:
    name: Node/Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Node version
        run: node --version && npm --version

      - name: Verify package.json
        run: test -f package.json && echo "✓ package.json found" || echo "✗ package.json missing"

      - name: Verify dependencies
        run: npm ls --depth=0 2>/dev/null | head -20 || echo "Dependencies check complete"
